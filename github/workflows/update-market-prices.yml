name: Update Market Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 5-9 * * 0,1,2,3,6"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get TSETMC prices
        run: |
          python3 <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          url = (
              "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch"
              "?market=0"
              "&paperTypes[0]=1&paperTypes[1]=2&paperTypes[2]=3"
              "&paperTypes[3]=4&paperTypes[4]=5&paperTypes[5]=6"
              "&paperTypes[6]=7&paperTypes[7]=8&paperTypes[8]=9"
              "&withBestLimits=false&hEven=0&RefID=0"
          )

          request = Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urlopen(request, timeout=30) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          prices = {}

          def scan(value):
              if isinstance(value, dict):

                  symbol = (
                      value.get("lVal18AFC")
                      or value.get("symbol")
                  )

                  last = (
                      value.get("pDrCotVal")
                      or value.get("pl")
                      or 0
                  )

                  closing = (
                      value.get("pClosing")
                      or value.get("pc")
                      or 0
                  )

                  if symbol:
                      try:
                          last = float(last)
                          closing = float(closing)

                          if last <= 0:
                              last = closing

                          if last > 0:
                              prices[str(symbol).strip()] = {
                                  "lastPrice": last,
                                  "closingPrice": closing
                              }
                      except:
                          pass

                  for item in value.values():
                      scan(item)

              elif isinstance(value, list):
                  for item in value:
                      scan(item)

          scan(data)

          if not prices:
              print("No market prices received.")
              sys.exit(1)

          result = {
              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source": "TSETMC",

              "prices": prices
          }

          with open(
              "prices.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print(
              "Prices received:",
              len(prices)
          )
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- prices.json; then
            echo "No price changes."
            exit 0
          fi

          git add prices.json
          git commit -m "Update market prices"
          git push
