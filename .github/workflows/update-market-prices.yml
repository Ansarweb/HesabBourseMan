name: Update Market Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 5-9 * * 0,1,2,3,6"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get market prices
        run: |
          python3 <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          url = "http://www.tsetmc.com/Loader.aspx?ParTree=15131M"

          request = Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*"
              }
          )

          with urlopen(request, timeout=30) as response:
              raw = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          if not raw:
              print("TSETMC returned empty response.")
              sys.exit(1)

          prices = {}

          # MarketWatchInit خروجی متنی دارد.
          # رکوردها با ; جدا می‌شوند.
          records = raw.split(";")

          for record in records:

              parts = record.split(",")

              if len(parts) < 5:
                  continue

              try:
                  ins_code = parts[0].strip()

                  if not ins_code:
                      continue

                  # در خروجی TSETMC:
                  # نماد و قیمت‌ها در فیلدهای مختلف قرار دارند.
                  # تمام فیلدها را بررسی می‌کنیم تا ساختار
                  # نسخه جاری TSETMC تغییر کرده باشد هم پوشش داده شود.

                  symbol = ""

                  for value in parts:

                      value = value.strip()

                      if value in (
                          "ستران",
                          "ومعادن"
                      ):
                          symbol = value
                          break

                  if not symbol:
                      continue

                  numbers = []

                  for value in parts:

                      value = value.strip()

                      try:
                          number = float(value)

                          if number > 0:
                              numbers.append(number)

                      except:
                          pass

                  if not numbers:
                      continue

                  # بزرگ‌ترین مقدار عددی معمولاً قیمت
                  # نیست؛ بنابراین چند مقدار متعارف را بررسی
                  # می‌کنیم و اولین مقدار مناسب را انتخاب می‌کنیم.

                  price = 0

                  for number in numbers:

                      if number >= 1:
                          price = number
                          break

                  if price <= 0:
                      continue

                  prices[symbol] = {
                      "lastPrice": price,
                      "closingPrice": price
                  }

              except:
                  continue

          # -------------------------------------------------
          # اگر دو نماد اصلی پیدا نشدند، خطا بده
          # تا Workflow سبزِ دروغین نشود.
          # -------------------------------------------------

          if "ستران" not in prices:
              print("ERROR: ستران price not found.")
              sys.exit(1)

          if "ومعادن" not in prices:
              print("ERROR: ومعادن price not found.")
              sys.exit(1)

          result = {
              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "TSETMC",

              "prices":
                  prices
          }

          with open(
              "prices.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "SUCCESS: prices.json created."
          )

          print(
              "Symbols:",
              len(prices)
          )

          print(
              "ستران:",
              prices["ستران"]
          )

          print(
              "ومعادن:",
              prices["ومعادن"]
          )
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update market prices"

          git push
